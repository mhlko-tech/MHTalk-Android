name: Publish signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name from app/build.gradle.kts (for example 1.6.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SIGNING_SHA256: 202d85e63b2af11aba0d44cfb31baaa14460193d2464344cd063f2e53cb6fc5d
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate release request and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MHTALK_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MHTALK_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MHTALK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MHTALK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Signed releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          configured_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ "$configured_version" != "$RELEASE_VERSION" ]]; then
            echo "Requested version $RELEASE_VERSION does not match configured version $configured_version" >&2
            exit 1
          fi

      - name: Materialize signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MHTALK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/mhtalk-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "MHTALK_ANDROID_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"

      - name: Test, lint and build signed direct APK
        shell: bash
        env:
          MHTALK_ANDROID_STORE_PASSWORD: ${{ secrets.MHTALK_ANDROID_STORE_PASSWORD }}
          MHTALK_ANDROID_KEY_ALIAS: ${{ secrets.MHTALK_ANDROID_KEY_ALIAS }}
          MHTALK_ANDROID_KEY_PASSWORD: ${{ secrets.MHTALK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -PMHTALK_PLAY_DISTRIBUTION=false testDebugUnitTest lintRelease assembleRelease
          grep -Fq 'public static final boolean PLAY_DISTRIBUTION = false;' \
            app/build/generated/source/buildConfig/release/com/mhlko/talk/BuildConfig.java

      - name: Build signed Google Play AAB
        shell: bash
        env:
          MHTALK_ANDROID_STORE_PASSWORD: ${{ secrets.MHTALK_ANDROID_STORE_PASSWORD }}
          MHTALK_ANDROID_KEY_ALIAS: ${{ secrets.MHTALK_ANDROID_KEY_ALIAS }}
          MHTALK_ANDROID_KEY_PASSWORD: ${{ secrets.MHTALK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PMHTALK_PLAY_DISTRIBUTION=true bundleRelease
          grep -Fq 'public static final boolean PLAY_DISTRIBUTION = true;' \
            app/build/generated/source/buildConfig/release/com/mhlko/talk/BuildConfig.java

      - name: Verify release signature and checksums
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          aab_path="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk_path"
          test -s "$aab_path"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk_path" | tee signing-report.txt

          actual_fingerprint="$(sed -n 's/^.*certificate SHA-256 digest: //p' signing-report.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ "$actual_fingerprint" != "$EXPECTED_SIGNING_SHA256" ]]; then
            echo "Unexpected Android signing certificate: $actual_fingerprint" >&2
            exit 1
          fi

          sha256sum "$apk_path" "$aab_path" > SHA256SUMS.txt
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MHTalk-Android-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.verify.outputs.apk_path }}
            ${{ steps.verify.outputs.aab_path }}
            signing-report.txt
            SHA256SUMS.txt

      - name: Create or repair GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.verify.outputs.apk_path }}
          AAB_PATH: ${{ steps.verify.outputs.aab_path }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          notes="Official MHTalk Android $RELEASE_VERSION release. This update preserves LiveKit-equivalent microphone, screen-audio and Bluetooth behavior across compatible RTC providers and applies the corrected Plus, Pro, Ultimate and Max Supporter hierarchy. The direct APK uses MHTalk's original long-term signing identity, so existing users can update normally; the accompanying AAB is the Google Play-safe build."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK_PATH" "$AAB_PATH" signing-report.txt SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "MHTalk Android $RELEASE_VERSION" --notes "$notes" --latest
          else
            gh release create "$tag" "$APK_PATH" "$AAB_PATH" signing-report.txt SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "MHTalk Android $RELEASE_VERSION" \
              --notes "$notes" \
              --latest
          fi
